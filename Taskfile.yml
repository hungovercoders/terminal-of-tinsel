version: '3'

includes:
  ss:
    taskfile: ./Taskfile.ss.yml

tasks:
  default:
    desc: Format, lint and test
    cmds:
      - task: check

  build:
    desc: Build a release binary into target/release
    cmds:
      - cargo build --release

  run:
    desc: Run the CLI, e.g. task run -- creature krampus
    cmds:
      - cargo run --quiet -- {{.CLI_ARGS}}

  check:
    desc: Format check, clippy and every test
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo test --workspace

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt --all

  site:
    desc: Build the website into dist/
    cmds:
      - cargo run --quiet -p tinsel-site -- --out dist

  site:serve:
    desc: Build the website and serve it on http://localhost:8025
    cmds:
      - task: site
      - python3 -m http.server 8025 --directory dist

  shelldocs:
    desc: Regenerate man/ and completions/ after changing a command or a flag
    cmds:
      - UPDATE_SHELLDOCS=1 cargo test shell_docs

  release:plan:
    desc: Show what cargo-dist would build for a release
    cmds:
      - dist plan
