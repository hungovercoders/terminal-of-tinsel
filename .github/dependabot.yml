# Keeps the dependencies moving as pull requests, so an advisory arrives
# with its fix instead of as an alert nobody owns.
version: 2
updates:
  # Cargo: the program itself. AGENTS.md asks for a small dependency list,
  # so each bump is its own PR, judged on its merits. The clap crates move
  # together: clap_complete's dynamic completion is behind an unstable
  # feature, and 'cargo test shell_docs' shows whether its scripts changed.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      clap:
        patterns: ["clap", "clap_*"]
    commit-message:
      prefix: "chore"

  # The root package.json is CI tooling only: slopstopper's checks.
  # Minor and patch bumps come as one PR a week; a major gets its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"

  # ci.yml pins actions by major tag; this keeps them current. release.yml
  # is generated by cargo-dist and the ss-*.yml workflows are copied in by
  # slopstopper's installer, pins included, so bumps to those arrive by
  # upgrading the tool that wrote them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
